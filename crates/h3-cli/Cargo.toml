[package]
name = "h3-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
h3-core = { version = "0.1.0", path = "../h3-core" }
h3-cpu = { version = "0.1.0", path = "../h3-cpu" }
h3-cuda = { version = "0.1.0", path = "../h3-cuda", optional = true }
h3-model = { version = "0.1.0", path = "../h3-model" }
h3-text = { version = "0.1.0", path = "../h3-text" }
h3-wgpu = { version = "0.1.0", path = "../h3-wgpu", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = "2"

[features]
default = ["wgpu"]
wgpu = ["dep:h3-wgpu"]
cuda = ["dep:h3-cuda"]

[[bin]]
name = "h3"
path = "src/main.rs"
