[package]
name = "h3-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
h3-core = { version = "0.1.0", path = "../h3-core" }
h3-cpu = { version = "0.1.0", path = "../h3-cpu" }
h3-cuda = { version = "0.1.0", path = "../h3-cuda", optional = true, default-features = false }
h3-model = { version = "0.1.0", path = "../h3-model" }
h3-text = { version = "0.1.0", path = "../h3-text" }
h3-wgpu = { version = "0.1.0", path = "../h3-wgpu", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12.0"
ureq = "2"

[features]
default = ["wgpu"]
wgpu = ["dep:h3-wgpu"]
# `cuda` binds cudarc to CUDA 12.8 (the nvidia/cuda:12.8 runtime images),
# `cuda-13` to CUDA 13 (fastvideo-rs's serve image, fastvideo-studio); the
# libraries are loaded at run time either way.
cuda = ["dep:h3-cuda", "h3-cuda/cuda-12"]
cuda-13 = ["dep:h3-cuda", "h3-cuda/cuda-13"]

[[bin]]
name = "h3"
path = "src/main.rs"
