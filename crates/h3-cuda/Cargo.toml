[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "cublaslt", "nvrtc", "dynamic-loading", "cuda-12080", "f16"] }
h3-core = { version = "0.1.0", path = "../h3-core" }
