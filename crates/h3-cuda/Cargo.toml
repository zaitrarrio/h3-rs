[package]
name = "h3-cuda"
version = "0.1.0"
edition = "2024"

[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "cublaslt", "nvrtc", "dynamic-loading", "f16"] }
h3-core = { version = "0.1.0", path = "../h3-core" }
h3-cpu = { version = "0.1.0", path = "../h3-cpu" }
h3-model = { version = "0.1.0", path = "../h3-model" }
half = "2.7.1"
rayon = "1.12.0"

[features]
# cudarc panics without a version feature and cannot have two (their
# generated bindings collide), so this crate defaults to 12.8 for its own
# tests and the CLI depends on it with default-features = false, picking one.
default = ["cuda-12"]
# The CUDA generation cudarc binds against; the libraries are loaded at run
# time, so this only has to match what the host image ships (12.8 for the
# nvidia/cuda:12.8 runtime, 13 for fastvideo-rs's serve image / fastvideo-studio).
cuda-12 = ["cudarc/cuda-12080"]
cuda-13 = ["cudarc/cuda-13000"]
